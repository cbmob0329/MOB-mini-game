<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="party-ui.css"><title>記念画像の表示テスト</title><body><main id="preview"></main><script src="party-core.js"></script><script src="party-collectibles.js"></script><script>
const screen=document.getElementById('preview');
const members=MobPartyCore.roster.slice(0,2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function menu(){screen.innerHTML='<section class="king-page"><h1>記念画像の表示テスト</h1><p>実際の描画関数を使う確認用ページです。大会記録は変更しません。</p><button id="card">MOBトレカを表示</button><button id="wall">壁紙エディターを表示</button></section>';screen.querySelector('#card').onclick=async()=>{screen.innerHTML='<section class="king-page"><canvas id="sample" class="king-card"></canvas><button id="back">戻る</button></section>';screen.querySelector('#back').onclick=menu;await MobCollectibles.card(screen.querySelector('canvas'),{playerName:'表示テスト',characterName:members[0].name,img:members[0].img,total:489,rank:'MOB',perfect:3,date:'2026/9/23'});};screen.querySelector('#wall').onclick=()=>MobCollectibles.wallpaper({screen,esc,members,teamName:'TEAM 1',done:menu});}
menu();
</script></body></html>
