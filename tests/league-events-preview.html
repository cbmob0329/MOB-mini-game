<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>League event UI verification</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../party-ui.css"></head><body><div id="app"><header class="topbar" style="height:95px;box-sizing:border-box"><span></span><div class="title-wrap"><span>MOB</span><strong>PARTY GAMES</strong><small class="app-version-v201">EVENT PREVIEW</small></div><span></span></header><main id="screen" class="screen"></main></div><script src="../party-league-events.js"></script><script>
const screen=document.getElementById('screen');let serial=0;
const entrants=Array.from({length:40},(_,i)=>({id:'p'+i,no:i+1,teamId:'L'+Math.floor(i/2),team:'TEAM '+(Math.floor(i/2)+1),name:i===0?'プレイヤー・レッド':'モブくん '+(i+1),img:'../icon/'+String(i%10+1).padStart(2,'0')+'.png',cpu:i!==0}));
function menu(){serial++;screen.innerHTML='<h1>大会イベントの表示確認</h1><button id="minority">少数派を開始（40人）</button><button id="crowd">39人脱落の表示確認</button><button id="bomb">集中大爆弾を開始（20人）</button>';document.getElementById('minority').onclick=()=>start('minorityMob');document.getElementById('crowd').onclick=()=>{let n=0;start('minorityMob',()=>++n===3?.1:.9);};document.getElementById('bomb').onclick=()=>start('focusBombMob');}
function start(key,random){const own=++serial;MobLeagueEvents.run({screen,key,random,entrants:key==='minorityMob'?entrants:entrants.slice(0,20),esc:s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),valid:()=>serial===own,clear(){},top(){window.scrollTo(0,0)},beep(){},done:scores=>{screen.innerHTML='<h1>結果</h1><pre>'+JSON.stringify(scores,null,2)+'</pre><button id="again">確認メニューへ</button>';document.getElementById('again').onclick=menu;}});}
menu();
</script></body></html>
